<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Hexagon / Badge -->
  <polygon points="50,6 90,28 90,72 50,94 10,72 10,28" 
           fill="#0d111b" 
           stroke="url(#grad1)" 
           stroke-width="3" 
           stroke-linejoin="round" />
           
  <!-- Stylized "K" & Code Brackets / Hammer Nodes -->
  <!-- Left Pillar -->
  <rect x="30" y="26" width="9" height="48" rx="4.5" fill="url(#grad1)" filter="url(#glow)" />
  
  <!-- Upper Arm -->
  <path d="M41 50 L64 28 C66 26 70 28 69 31 L50 51 Z" fill="url(#grad1)" />
  
  <!-- Lower Arm with Spark/Craft Node -->
  <path d="M46 47 L68 70 C70 72 68 75 64 74 L41 51 Z" fill="url(#grad1)" />
  
  <!-- Craftsmanship Spark (Amber Dot) -->
  <circle cx="72" cy="27" r="4.5" fill="url(#grad2)" filter="url(#glow)" />
</svg>
